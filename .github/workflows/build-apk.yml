name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install native push plugin (version alignée sur Capacitor)
        run: |
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor major = $MAJOR"
          npm install --save "@capacitor/push-notifications@^$MAJOR.0.0"

      - name: Patch app for native push notifications
        run: |
          python3 - << 'EOF'
          import os
          OLD1 = r'''  const [pushPermission, setPushPermission] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
            const enablePushNotifications = async () => {
              if (!firebaseMessaging || typeof Notification === "undefined") { setPushPermission("unsupported"); return; }
          '''
          NEW1 = r'''  // Dans l'APK Android (Capacitor), l'API web "Notification" + service worker n'existe pas dans la
            // WebView : on utilise donc le plugin natif @capacitor/push-notifications (FCM Android).
            // Sur le web (Vercel / navigateur), le fonctionnement d'origine (Firebase web + VAPID) est conservé.
            const isNativeApp = typeof window !== "undefined" && !!window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform();
            const [pushPermission, setPushPermission] = useState(isNativeApp ? "default" : (typeof Notification !== "undefined" ? Notification.permission : "unsupported"));
            // askPermission = true : appelé depuis le bouton (peut afficher la fenêtre d'autorisation Android 13+).
            // askPermission = false : appelé au démarrage, n'enregistre l'appareil que si l'autorisation est déjà accordée.
            const registerNativePush = async (askPermission) => {
              try {
                const { PushNotifications } = await import("@capacitor/push-notifications");
                let perm = await PushNotifications.checkPermissions();
                if (askPermission && (perm.receive === "prompt" || perm.receive === "prompt-with-rationale")) {
                  perm = await PushNotifications.requestPermissions();
                }
                if (perm.receive !== "granted") {
                  if (askPermission) setPushPermission("denied");
                  return;
                }
                setPushPermission("granted");
                if (!window.__nativePushListeners) {
                  window.__nativePushListeners = true;
                  // Reçoit le token FCM de cet appareil et l'enregistre dans Supabase (table push_tokens).
                  await PushNotifications.addListener("registration", async (t) => {
                    try {
                      const { data: userData } = await supabase.auth.getUser();
                      if (!userData || !userData.user || !t || !t.value) return;
                      await supabase.from("push_tokens").upsert({ owner_id: userData.user.id, token: t.value }, { onConflict: "token" });
                    } catch (e) { /* best-effort */ }
                  });
                  await PushNotifications.addListener("registrationError", (err) => {
                    console.error("Échec de l'enregistrement push natif :", err && (err.error || err));
                  });
                  // Clic sur une notification d'anomalie : ouvre l'Historique avec le bon filtre.
                  await PushNotifications.addListener("pushNotificationActionPerformed", (action) => {
                    const d = action && action.notification && action.notification.data;
                    const alertType = d && (d.alertType || d.alert_type);
                    if (alertType) applyAlertTypeFilter(alertType);
                  });
                }
                await PushNotifications.register();
              } catch (e) {
                console.error("Push natif indisponible :", e && (e.message || e));
                if (askPermission) setPushPermission("unsupported");
              }
            };
            const enablePushNotifications = async () => {
              if (isNativeApp) { await registerNativePush(true); return; }
              if (!firebaseMessaging || typeof Notification === "undefined") { setPushPermission("unsupported"); return; }
          '''
          OLD2 = r'''    // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            const [debtsSearch, setDebtsSearch]'''
          NEW2 = r'''    // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            // APK Android : si l'autorisation de notification est déjà accordée, ré-enregistre l'appareil
            // à chaque connexion / ouverture (le token FCM peut changer) et met à jour l'état du bouton.
            useEffect(() => {
              if (!isNativeApp) return;
              const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
                if (session && session.user && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) registerNativePush(false);
              });
              return () => listener.subscription.unsubscribe();
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            const [debtsSearch, setDebtsSearch]'''
          targets = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("node_modules", ".git", "android", "dist")]
              if "BoutiqueApp.jsx" in files:
                  targets.append(os.path.join(root, "BoutiqueApp.jsx"))
          if not targets:
              raise SystemExit("ERREUR : BoutiqueApp.jsx introuvable dans le depot.")
          for path in targets:
              with open(path, "r", encoding="utf-8", newline="") as f:
                  s = f.read()
              if "registerNativePush" in s:
                  print(path + " : deja modifie, rien a faire")
                  continue
              crlf = "\r\n" in s
              o1, n1, o2, n2 = OLD1, NEW1, OLD2, NEW2
              if crlf:
                  o1, n1, o2, n2 = [x.replace("\n", "\r\n") for x in (o1, n1, o2, n2)]
              if s.count(o1) != 1 or s.count(o2) != 1:
                  raise SystemExit("ERREUR : " + path + " ne correspond pas a la version attendue, aucune modification faite.")
              s = s.replace(o1, n1, 1).replace(o2, n2, 1)
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(s)
              print(path + " : notifications natives ajoutees")
          EOF

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add google-services.json (Firebase push)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "ERREUR : le secret GOOGLE_SERVICES_JSON est vide ou absent."
            exit 1
          fi
          printf '%s' "$GSJ" > android/app/google-services.json
          echo "google-services.json installé"

      - name: Generate app icon
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#082868' --iconBackgroundColorDark '#082868' --assetPath .

      - name: Configure deep link for Google OAuth
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          new_intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.shopnify.app" android:host="login-callback" />
                  </intent-filter>
          """
          if "</intent-filter>" not in content:
              raise SystemExit("ERREUR : aucune balise </intent-filter> trouvée dans le manifest, rien n'a été inséré.")
          content = content.replace("</intent-filter>", "</intent-filter>" + new_intent_filter, 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Deep link ajouté avec succès")
          EOF

      - name: Add Android permissions (camera + notifications + location)
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "<application" not in content:
              raise SystemExit("ERREUR : balise <application> introuvable dans le manifest, rien n'a été inséré.")
          lines = []
          for perm in ["CAMERA", "POST_NOTIFICATIONS", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]:
              tag = "android.permission." + perm
              if tag not in content:
                  lines.append('<uses-permission android:name="' + tag + '" />')
          if "android.hardware.camera" not in content:
              lines.append('<uses-feature android:name="android.hardware.camera" android:required="false" />')
          if lines:
              block = "\n    ".join(lines) + "\n    "
              content = content.replace("<application", block + "<application", 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Permissions ajoutées : " + ", ".join(lines))
          else:
              print("Permissions déjà présentes, rien à ajouter")
          EOF

      - name: Configure MainActivity for native Google Sign-In
        run: |
          mkdir -p android/app/src/main/java/com/shopnify/app
          cat > android/app/src/main/java/com/shopnify/app/MainActivity.java << 'EOF'
          package com.shopnify.app;

          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import com.getcapacitor.PluginHandle;
          import com.getcapacitor.Plugin;
          import android.content.Intent;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;

          // ModifiedMainActivityForSocialLoginPlugin est indispensable au bon fonctionnement
          // du plugin @capgo/capacitor-social-login (connexion Google native).
          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                      if (pluginHandle == null) {
                          Log.i("Google Activity Result", "SocialLogin login handle is null");
                          return;
                      }
                      Plugin plugin = pluginHandle.getInstance();
                      if (!(plugin instanceof SocialLoginPlugin)) {
                          Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                          return;
                      }
                      ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                  }
              }

              // Cette fonction ne sera jamais appelée, elle doit juste exister.
              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF
          echo "MainActivity.java configuré avec succès"

      - name: Restore stable debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
          echo "Certificat de signature stable installé"

      - name: Sync Capacitor
        run: npx cap sync android

      # ---- DIAGNOSTIC TEMPORAIRE : à retirer une fois le problème de connexion résolu ----
      # Affiche dans les logs le contenu exact du manifest juste avant la compilation,
      # pour vérifier que le lien profond Google OAuth et les permissions sont bien présents
      # au moment du build (et pas seulement juste après l'étape qui les ajoute, avant que
      # "cap sync" ne s'exécute).
      - name: Verify manifest before build
        run: |
          echo "----- Contenu complet de AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml
          echo "----------------------------------------------------"
          if grep -q "login-callback" android/app/src/main/AndroidManifest.xml; then
            echo "OK : le lien profond 'login-callback' est bien présent dans le manifest final."
          else
            echo "PROBLEME : le lien profond 'login-callback' est ABSENT du manifest final !"
            exit 1
          fi
          if [ -f android/app/google-services.json ]; then
            echo "OK : google-services.json présent."
          else
            echo "PROBLEME : google-services.json ABSENT !"
            exit 1
          fi
          for PERM in CAMERA POST_NOTIFICATIONS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            if grep -q "android.permission.$PERM" android/app/src/main/AndroidManifest.xml; then
              echo "OK : permission $PERM présente."
            else
              echo "PROBLEME : permission $PERM ABSENTE du manifest final !"
              exit 1
            fi
          done
      # ---- FIN DIAGNOSTIC TEMPORAIRE ----

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopnify-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
