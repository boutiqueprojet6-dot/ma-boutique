name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install native push plugin (version alignée sur Capacitor)
        run: |
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor major = $MAJOR"
          npm install --save "@capacitor/push-notifications@^$MAJOR.0.0"

      - name: Patch app for native push notifications
        run: |
          python3 - << 'EOF'
          import os
          OLD1 = r'''  const [pushPermission, setPushPermission] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
            const enablePushNotifications = async () => {
              if (!firebaseMessaging || typeof Notification === "undefined") { setPushPermission("unsupported"); return; }
          '''
          NEW1 = r'''  // Dans l'APK Android (Capacitor), l'API web "Notification" + service worker n'existe pas dans la
            // WebView : on utilise donc le plugin natif @capacitor/push-notifications (FCM Android).
            // Sur le web (Vercel / navigateur), le fonctionnement d'origine (Firebase web + VAPID) est conservé.
            const isNativeApp = typeof window !== "undefined" && !!window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform();
            const [pushPermission, setPushPermission] = useState(isNativeApp ? "default" : (typeof Notification !== "undefined" ? Notification.permission : "unsupported"));
            // askPermission = true : appelé depuis le bouton (peut afficher la fenêtre d'autorisation Android 13+).
            // askPermission = false : appelé au démarrage, n'enregistre l'appareil que si l'autorisation est déjà accordée.
            const registerNativePush = async (askPermission) => {
              try {
                const { PushNotifications } = await import("@capacitor/push-notifications");
                let perm = await PushNotifications.checkPermissions();
                if (askPermission && (perm.receive === "prompt" || perm.receive === "prompt-with-rationale")) {
                  perm = await PushNotifications.requestPermissions();
                }
                if (perm.receive !== "granted") {
                  if (askPermission) setPushPermission("denied");
                  return;
                }
                setPushPermission("granted");
                if (!window.__nativePushListeners) {
                  window.__nativePushListeners = true;
                  // Reçoit le token FCM de cet appareil et l'enregistre dans Supabase (table push_tokens).
                  await PushNotifications.addListener("registration", async (t) => {
                    try {
                      const { data: userData } = await supabase.auth.getUser();
                      if (!userData || !userData.user || !t || !t.value) return;
                      await supabase.from("push_tokens").upsert({ owner_id: userData.user.id, token: t.value }, { onConflict: "token" });
                    } catch (e) { /* best-effort */ }
                  });
                  await PushNotifications.addListener("registrationError", (err) => {
                    console.error("Échec de l'enregistrement push natif :", err && (err.error || err));
                  });
                  // Clic sur une notification d'anomalie : ouvre l'Historique avec le bon filtre.
                  await PushNotifications.addListener("pushNotificationActionPerformed", (action) => {
                    const d = action && action.notification && action.notification.data;
                    const alertType = d && (d.alertType || d.alert_type);
                    if (alertType) applyAlertTypeFilter(alertType);
                  });
                }
                await PushNotifications.register();
              } catch (e) {
                console.error("Push natif indisponible :", e && (e.message || e));
                if (askPermission) setPushPermission("unsupported");
              }
            };
            const enablePushNotifications = async () => {
              if (isNativeApp) { await registerNativePush(true); return; }
              if (!firebaseMessaging || typeof Notification === "undefined") { setPushPermission("unsupported"); return; }
          '''
          OLD2 = r'''    // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            const [debtsSearch, setDebtsSearch]'''
          NEW2 = r'''    // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            // APK Android : si l'autorisation de notification est déjà accordée, ré-enregistre l'appareil
            // à chaque connexion / ouverture (le token FCM peut changer) et met à jour l'état du bouton.
            useEffect(() => {
              if (!isNativeApp) return;
              const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
                if (session && session.user && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) registerNativePush(false);
              });
              return () => listener.subscription.unsubscribe();
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            const [debtsSearch, setDebtsSearch]'''
          targets = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("node_modules", ".git", "android", "dist")]
              if "BoutiqueApp.jsx" in files:
                  targets.append(os.path.join(root, "BoutiqueApp.jsx"))
          if not targets:
              raise SystemExit("ERREUR : BoutiqueApp.jsx introuvable dans le depot.")
          for path in targets:
              with open(path, "r", encoding="utf-8", newline="") as f:
                  s = f.read()
              if "registerNativePush" in s:
                  print(path + " : deja modifie, rien a faire")
                  continue
              crlf = "\r\n" in s
              o1, n1, o2, n2 = OLD1, NEW1, OLD2, NEW2
              if crlf:
                  o1, n1, o2, n2 = [x.replace("\n", "\r\n") for x in (o1, n1, o2, n2)]
              if s.count(o1) != 1 or s.count(o2) != 1:
                  raise SystemExit("ERREUR : " + path + " ne correspond pas a la version attendue, aucune modification faite.")
              s = s.replace(o1, n1, 1).replace(o2, n2, 1)
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(s)
              print(path + " : notifications natives ajoutees")
          EOF

      - name: Build web app
        env:
          VITE_CAPACITOR_BUILD: "true"
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add google-services.json (Firebase push)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "ERREUR : le secret GOOGLE_SERVICES_JSON est vide ou absent."
            exit 1
          fi
          printf '%s' "$GSJ" > android/app/google-services.json
          echo "google-services.json installé"

      - name: Generate app icon
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#082868' --iconBackgroundColorDark '#082868' --assetPath .

      - name: Configure deep link for Google OAuth (HTTPS App Link)
        run: |
          python3 - << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "auth-callback" in content and 'android:autoVerify="true"' in content:
              print("App Link deja present, rien a faire")
          else:
              new_if = """
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="ma-boutique-tawny.vercel.app" android:pathPrefix="/auth-callback.html" />
                      </intent-filter>
          """
              # On cible explicitement l'intent-filter qui contient le LAUNCHER (l'activité
              # principale), et non "le premier </intent-filter> du fichier" : si un plugin ou
              # une version de cap sync insère un autre intent-filter avant, l'ancienne méthode
              # plaçait le deep link au mauvais endroit (silencieusement, sans erreur de build).
              pattern = r'(<category android:name="android\.intent\.category\.LAUNCHER"\s*/>\s*</intent-filter>)'
              if not re.search(pattern, content):
                  raise SystemExit("ERREUR : intent-filter LAUNCHER introuvable dans le manifest, rien n'a ete insere.")
              content = re.sub(pattern, r'\1' + new_if, content, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("App Link HTTPS ajoute avec succes, juste apres le LAUNCHER")
          EOF

      - name: Add Android permissions (camera + notifications + location)
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          if "<application" not in content:
              raise SystemExit("ERREUR : balise <application> introuvable dans le manifest, rien n'a été inséré.")
          lines = []
          for perm in ["CAMERA", "POST_NOTIFICATIONS", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION"]:
              tag = "android.permission." + perm
              if tag not in content:
                  lines.append('<uses-permission android:name="' + tag + '" />')
          if "android.hardware.camera" not in content:
              lines.append('<uses-feature android:name="android.hardware.camera" android:required="false" />')
          if lines:
              block = "\n    ".join(lines) + "\n    "
              content = content.replace("<application", block + "<application", 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Permissions ajoutées : " + ", ".join(lines))
          else:
              print("Permissions déjà présentes, rien à ajouter")
          EOF

      - name: Add widget receiver to manifest
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          receiver_block = '''
                  <receiver
                      android:name=".SalesWidgetProvider"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/sales_widget_info" />
                  </receiver>
          '''
          if "</application>" not in content:
              raise SystemExit("ERREUR : balise </application> introuvable dans le manifest.")
          if "SalesWidgetProvider" in content:
              print("Receiver deja present, rien a faire")
          else:
              content = content.replace("</application>", receiver_block + "    </application>", 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Receiver du widget ajoute avec succes")
          EOF

      - name: Add widget resources (Ventes du jour)
        run: |
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/java/com/shopnify/app

          # Widget 4x2 (redimensionnable). previewLayout / targetCell* : Android 12+, ignorés avant.
          cat > android/app/src/main/res/xml/sales_widget_info.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/sales_widget"
              android:previewLayout="@layout/sales_widget"
              android:previewImage="@mipmap/ic_launcher"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # Fond : dégradé bleu nuit -> bleu Boutipro, coins arrondis.
          cat > android/app/src/main/res/drawable/sales_widget_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="315" android:startColor="#0F2A47" android:centerColor="#1B3A5C" android:endColor="#2563EB" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          # Pastille d'information (blanc translucide).
          cat > android/app/src/main/res/drawable/sales_widget_chip.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#29FFFFFF" />
              <corners android:radius="12dp" />
          </shape>
          EOF

          # Pastille d'alerte (stock bas) : ambre.
          cat > android/app/src/main/res/drawable/sales_widget_chip_alert.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F59E0B" />
              <corners android:radius="12dp" />
          </shape>
          EOF

          # Bouton « + Vente » : blanc plein.
          cat > android/app/src/main/res/drawable/sales_widget_add.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # Barre de progression vers une journée habituelle.
          cat > android/app/src/main/res/drawable/sales_widget_progress.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape android:shape="rectangle">
                      <solid android:color="#33FFFFFF" />
                      <corners android:radius="3dp" />
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape android:shape="rectangle">
                          <solid android:color="#4ADE80" />
                          <corners android:radius="3dp" />
                      </shape>
                  </clip>
              </item>
          </layer-list>
          EOF

          cat > android/app/src/main/res/layout/sales_widget.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_vertical"
              android:paddingLeft="14dp"
              android:paddingRight="14dp"
              android:paddingTop="10dp"
              android:paddingBottom="10dp"
              android:background="@drawable/sales_widget_bg">

              <!-- Ligne 1 : logo, « Ventes aujourd'hui · Nom de la boutique », % d'une journée habituelle -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">

                  <ImageView
                      android:layout_width="16dp"
                      android:layout_height="16dp"
                      android:src="@mipmap/ic_launcher"
                      android:contentDescription="@null" />

                  <TextView
                      android:id="@+id/widget_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginLeft="6dp"
                      android:layout_marginRight="6dp"
                      android:text="Boutipro"
                      android:textColor="#D9FFFFFF"
                      android:textSize="11sp"
                      android:singleLine="true"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/widget_pct"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text=""
                      android:textColor="#4ADE80"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:singleLine="true" />
              </LinearLayout>

              <!-- Ligne 2 : montant du jour + bouton « + Vente » -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">

                  <TextView
                      android:id="@+id/widget_amount"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="—"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold"
                      android:singleLine="true"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/widget_add"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginLeft="8dp"
                      android:paddingLeft="12dp"
                      android:paddingRight="12dp"
                      android:paddingTop="5dp"
                      android:paddingBottom="5dp"
                      android:background="@drawable/sales_widget_add"
                      android:text="+"
                      android:textColor="#1B3A5C"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:singleLine="true" />
              </LinearLayout>

              <!-- Ligne 3 : progression vers une journée habituelle -->
              <ProgressBar
                  android:id="@+id/widget_progress"
                  style="@android:style/Widget.ProgressBar.Horizontal"
                  android:layout_width="match_parent"
                  android:layout_height="5dp"
                  android:layout_marginTop="4dp"
                  android:max="100"
                  android:progress="0"
                  android:progressDrawable="@drawable/sales_widget_progress" />

              <!-- Ligne 4 : nombre de ventes, produits en stock bas, dettes à encaisser -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/widget_chip_sales"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:background="@drawable/sales_widget_chip"
                      android:text=""
                      android:textColor="#FFFFFF"
                      android:textSize="10sp"
                      android:singleLine="true" />

                  <TextView
                      android:id="@+id/widget_chip_stock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginLeft="5dp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:background="@drawable/sales_widget_chip"
                      android:text=""
                      android:textColor="#FFFFFF"
                      android:textSize="10sp"
                      android:singleLine="true" />

                  <TextView
                      android:id="@+id/widget_chip_debts"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginLeft="5dp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:background="@drawable/sales_widget_chip"
                      android:text=""
                      android:textColor="#FFFFFF"
                      android:textSize="10sp"
                      android:singleLine="true"
                      android:ellipsize="end" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat > android/app/src/main/java/com/shopnify/app/SalesWidgetProvider.java << 'EOF'
          package com.shopnify.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          // Widget « Ventes du jour ». Tous les textes arrivent déjà traduits et formatés depuis
          // l'app (voir SalesWidgetPlugin) : rien n'est écrit en dur dans une langue ici.
          public class SalesWidgetProvider extends AppWidgetProvider {

              public static final String PREFS_NAME = "MaBoutiqueWidgetPrefs";
              public static final String KEY_DAY = "day";
              public static final String KEY_TITLE = "title";
              public static final String KEY_TOTAL = "todayTotal";
              public static final String KEY_ZERO_TOTAL = "zeroTotal";
              public static final String KEY_SALES = "salesText";
              public static final String KEY_ZERO_SALES = "zeroSalesText";
              public static final String KEY_PCT = "usualPct";
              public static final String KEY_STOCK = "stockText";
              public static final String KEY_STOCK_ALERT = "stockAlert";
              public static final String KEY_DEBTS = "debtsText";
              public static final String KEY_ADD = "addLabel";

              public static void updateAllWidgets(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  int[] ids = manager.getAppWidgetIds(new ComponentName(context, SalesWidgetProvider.class));
                  for (int id : ids) {
                      updateWidget(context, manager, id);
                  }
              }

              private static void setChip(RemoteViews views, int viewId, String text) {
                  if (text == null || text.length() == 0) {
                      views.setViewVisibility(viewId, View.GONE);
                  } else {
                      views.setViewVisibility(viewId, View.VISIBLE);
                      views.setTextViewText(viewId, text);
                  }
              }

              public static void updateWidget(Context context, AppWidgetManager manager, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.sales_widget);

                  String title = prefs.getString(KEY_TITLE, "");
                  if (title.length() == 0) {
                      // Jamais alimenté (app pas encore ouverte, ou déconnexion) : écran neutre.
                      views.setTextViewText(R.id.widget_title, "Boutipro");
                      views.setTextViewText(R.id.widget_amount, "—");
                      views.setTextViewText(R.id.widget_pct, "");
                      views.setViewVisibility(R.id.widget_progress, View.INVISIBLE);
                      views.setViewVisibility(R.id.widget_add, View.GONE);
                      setChip(views, R.id.widget_chip_sales, "");
                      setChip(views, R.id.widget_chip_stock, "");
                      setChip(views, R.id.widget_chip_debts, "");
                  } else {
                      // Les chiffres appartiennent à un jour précis. Après minuit, tant que l'app n'a
                      // pas été rouverte, on affiche zéro plutôt que le total d'hier sous le titre
                      // « Ventes aujourd'hui ».
                      String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                      boolean fresh = today.equals(prefs.getString(KEY_DAY, ""));
                      int pct = fresh ? prefs.getInt(KEY_PCT, -1) : (prefs.getInt(KEY_PCT, -1) >= 0 ? 0 : -1);

                      views.setTextViewText(R.id.widget_title, title);
                      views.setTextViewText(R.id.widget_amount, fresh ? prefs.getString(KEY_TOTAL, "—") : prefs.getString(KEY_ZERO_TOTAL, "—"));
                      setChip(views, R.id.widget_chip_sales, fresh ? prefs.getString(KEY_SALES, "") : prefs.getString(KEY_ZERO_SALES, ""));
                      if (pct >= 0) {
                          views.setTextViewText(R.id.widget_pct, pct + " %");
                          views.setTextColor(R.id.widget_pct, pct >= 100 ? 0xFF4ADE80 : 0xFFFFFFFF);
                          views.setViewVisibility(R.id.widget_progress, View.VISIBLE);
                          views.setProgressBar(R.id.widget_progress, 100, Math.min(100, pct), false);
                      } else {
                          views.setTextViewText(R.id.widget_pct, "");
                          views.setViewVisibility(R.id.widget_progress, View.INVISIBLE);
                      }
                      setChip(views, R.id.widget_chip_stock, prefs.getString(KEY_STOCK, ""));
                      views.setInt(R.id.widget_chip_stock, "setBackgroundResource",
                              prefs.getBoolean(KEY_STOCK_ALERT, false) ? R.drawable.sales_widget_chip_alert : R.drawable.sales_widget_chip);
                      setChip(views, R.id.widget_chip_debts, prefs.getString(KEY_DEBTS, ""));
                      String add = prefs.getString(KEY_ADD, "");
                      setChip(views, R.id.widget_add, add);
                  }

                  int immutable = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  // Toucher le widget ouvre l'app.
                  Intent launch = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  if (launch != null) {
                      views.setOnClickPendingIntent(R.id.widget_root,
                              PendingIntent.getActivity(context, 0, launch, PendingIntent.FLAG_UPDATE_CURRENT | immutable));
                  }
                  // Toucher « + Vente » ouvre l'app directement sur l'onglet Vente.
                  Intent sale = new Intent(Intent.ACTION_VIEW, Uri.parse("com.shopnify.app://widget/sale"));
                  sale.setClass(context, MainActivity.class);
                  sale.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  views.setOnClickPendingIntent(R.id.widget_add,
                          PendingIntent.getActivity(context, 1, sale, PendingIntent.FLAG_UPDATE_CURRENT | immutable));

                  manager.updateAppWidget(widgetId, views);
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      updateWidget(context, appWidgetManager, id);
                  }
              }
          }
          EOF

          cat > android/app/src/main/java/com/shopnify/app/SalesWidgetPlugin.java << 'EOF'
          package com.shopnify.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SalesWidget")
          public class SalesWidgetPlugin extends Plugin {

              @PluginMethod
              public void update(PluginCall call) {
                  SharedPreferences prefs = getContext().getSharedPreferences(
                          SalesWidgetProvider.PREFS_NAME, Context.MODE_PRIVATE);
                  Boolean clear = call.getBoolean("clear", false);
                  if (clear != null && clear) {
                      // Déconnexion : plus aucun chiffre de la boutique sur l'écran d'accueil.
                      prefs.edit().clear().apply();
                  } else {
                      Integer pct = call.getInt("usualPct", -1);
                      Boolean stockAlert = call.getBoolean("stockAlert", false);
                      prefs.edit()
                              .putString(SalesWidgetProvider.KEY_DAY, call.getString("day", ""))
                              .putString(SalesWidgetProvider.KEY_TITLE, call.getString("title", ""))
                              .putString(SalesWidgetProvider.KEY_TOTAL, call.getString("total", "—"))
                              .putString(SalesWidgetProvider.KEY_ZERO_TOTAL, call.getString("zeroTotal", "—"))
                              .putString(SalesWidgetProvider.KEY_SALES, call.getString("salesText", ""))
                              .putString(SalesWidgetProvider.KEY_ZERO_SALES, call.getString("zeroSalesText", ""))
                              .putInt(SalesWidgetProvider.KEY_PCT, pct != null ? pct : -1)
                              .putString(SalesWidgetProvider.KEY_STOCK, call.getString("stockText", ""))
                              .putBoolean(SalesWidgetProvider.KEY_STOCK_ALERT, stockAlert != null && stockAlert)
                              .putString(SalesWidgetProvider.KEY_DEBTS, call.getString("debtsText", ""))
                              .putString(SalesWidgetProvider.KEY_ADD, call.getString("addLabel", ""))
                              .apply();
                  }
                  SalesWidgetProvider.updateAllWidgets(getContext());
                  call.resolve();
              }
          }
          EOF

          echo "Fichiers du widget crees avec succes"

      - name: Configure MainActivity for native Google Sign-In
        run: |
          mkdir -p android/app/src/main/java/com/shopnify/app
          cat > android/app/src/main/java/com/shopnify/app/MainActivity.java << 'EOF'
          package com.shopnify.app;

          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import com.getcapacitor.PluginHandle;
          import com.getcapacitor.Plugin;
          import android.content.Intent;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;

          // ModifiedMainActivityForSocialLoginPlugin est indispensable au bon fonctionnement
          // du plugin @capgo/capacitor-social-login (connexion Google native).
          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {

              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  // Widget "Ventes du jour" : enregistre le plugin natif qui permet au JS
                  // d'écrire les données lues par le widget d'écran d'accueil.
                  registerPlugin(SalesWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                      if (pluginHandle == null) {
                          Log.i("Google Activity Result", "SocialLogin login handle is null");
                          return;
                      }
                      Plugin plugin = pluginHandle.getInstance();
                      if (!(plugin instanceof SocialLoginPlugin)) {
                          Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                          return;
                      }
                      ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                  }
              }

              // Cette fonction ne sera jamais appelée, elle doit juste exister.
              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF
          echo "MainActivity.java configuré avec succès"

      - name: Restore stable debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE }}" | base64 -d > ~/.android/debug.keystore
          echo "Certificat de signature stable installé"

      - name: Show signing fingerprints (SHA1 + SHA256)
        run: |
          echo "===== Empreintes de la clé de signature de l'APK ====="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "======================================================"
          echo "SHA1  -> a enregistrer dans Google Cloud Console > Identifiants > ID client OAuth"
          echo "         de type ANDROID (package com.shopnify.app) pour la connexion Google native."
          echo "SHA256 -> a copier (sans 'SHA256: ') dans public/.well-known/assetlinks.json (App Link)."

      - name: Sync Capacitor
        run: npx cap sync android

      # ---- DIAGNOSTIC TEMPORAIRE : à retirer une fois le problème de connexion résolu ----
      # Affiche dans les logs le contenu exact du manifest juste avant la compilation,
      # pour vérifier que le lien profond Google OAuth et les permissions sont bien présents
      # au moment du build (et pas seulement juste après l'étape qui les ajoute, avant que
      # "cap sync" ne s'exécute).
      - name: Verify manifest before build
        run: |
          echo "----- Contenu complet de AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml
          echo "----------------------------------------------------"
          if grep -q "auth-callback.html" android/app/src/main/AndroidManifest.xml; then
            echo "OK : l'App Link 'auth-callback.html' est bien présent dans le manifest final."
          else
            echo "PROBLEME : l'App Link 'auth-callback.html' est ABSENT du manifest final !"
            exit 1
          fi
          if [ -f android/app/google-services.json ]; then
            echo "OK : google-services.json présent."
          else
            echo "PROBLEME : google-services.json ABSENT !"
            exit 1
          fi
          for PERM in CAMERA POST_NOTIFICATIONS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            if grep -q "android.permission.$PERM" android/app/src/main/AndroidManifest.xml; then
              echo "OK : permission $PERM présente."
            else
              echo "PROBLEME : permission $PERM ABSENTE du manifest final !"
              exit 1
            fi
          done
          if grep -q "SalesWidgetProvider" android/app/src/main/AndroidManifest.xml; then
            echo "OK : le receiver du widget est bien présent dans le manifest final."
          else
            echo "PROBLEME : le receiver du widget est ABSENT du manifest final !"
            exit 1
          fi
      # ---- FIN DIAGNOSTIC TEMPORAIRE ----

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify deep link survived the Gradle manifest merger
        run: |
          AAPT=$(find "$ANDROID_HOME" -name "aapt" -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "PROBLEME : aapt introuvable, impossible de verifier le manifest final."
            exit 1
          fi
          echo "aapt utilise : $AAPT"
          echo "----- Manifest COMPILE (apres fusion Gradle) -----"
          $AAPT dump xmltree android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > merged_manifest_dump.txt
          cat merged_manifest_dump.txt
          echo "---------------------------------------------------"
          if grep -q "auth-callback.html" merged_manifest_dump.txt; then
            echo "OK : l'App Link 'auth-callback.html' est bien present dans l'APK COMPILE."
          else
            echo "PROBLEME : l'App Link 'auth-callback.html' est ABSENT de l'APK COMPILE (supprime pendant la fusion Gradle) !"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopnify-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true

      - name: Upload merged manifest dump
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest-dump
          path: merged_manifest_dump.txt
          overwrite: true


