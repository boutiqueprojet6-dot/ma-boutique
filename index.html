<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Titre et description : ce que Google affiche dans les résultats de recherche.
         Les mots-clés ("gestion boutique", pays ciblés) sont choisis pour correspondre
         à ce que vos clients tapent réellement sur Google. -->
    <title>Boutipro — Gestion de boutique simplifiée (stock, ventes, caisse, dettes)</title>
    <meta name="description" content="Boutipro aide les commerçants d'Afrique de l'Ouest à gérer leur boutique au quotidien : stock, ventes, caisse, dettes clients et fidélité, depuis un téléphone ou un ordinateur. Essai gratuit." />
    <meta name="keywords" content="gestion boutique, logiciel caisse, application vente, gestion stock, Mali, Sénégal, Côte d'Ivoire, Afrique de l'Ouest" />
    <link rel="canonical" href="https://www.boutipro.com/" />

    <!-- Open Graph : l'aperçu affiché quand le lien est partagé sur WhatsApp, Facebook, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.boutipro.com/" />
    <meta property="og:title" content="Boutipro — Gestion de boutique simplifiée" />
    <meta property="og:description" content="Stock, ventes, caisse et dettes clients : gérez votre boutique facilement depuis votre téléphone ou votre ordinateur." />
    <meta property="og:image" content="https://www.boutipro.com/icon-192.png" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Aperçu équivalent sur X/Twitter. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Boutipro — Gestion de boutique simplifiée" />
    <meta name="twitter:description" content="Stock, ventes, caisse et dettes clients : gérez votre boutique facilement depuis votre téléphone ou votre ordinateur." />
    <meta name="twitter:image" content="https://www.boutipro.com/icon-192.png" />

    <!-- Couleur de la barre du navigateur sur mobile (Android/Chrome). -->
    <meta name="theme-color" content="#1e2a5e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
