<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Titre et description : ce que Google affiche dans les résultats de recherche.
         Les mots-clés ("gestion boutique", pays ciblés) sont choisis pour correspondre
         à ce que vos clients tapent réellement sur Google. -->
    <title>Boutipro — Shop Management Made Simple (Inventory, Sales, Checkout, Debts)</title>
    <meta name="description" content="Boutipro helps shop owners worldwide run their business day to day: inventory, sales, cash register, customer debts, loyalty and an AI assistant, from a phone or computer. Free to try." />
    <meta name="keywords" content="shop management app, point of sale, inventory management, small business software, cash register app, retail management" />
    <link rel="canonical" href="https://www.boutipro.com/" />

    <!-- Open Graph : l'aperçu affiché quand le lien est partagé sur WhatsApp, Facebook, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.boutipro.com/" />
    <meta property="og:title" content="Boutipro — Shop Management Made Simple" />
    <meta property="og:description" content="Inventory, sales, cash register, customer debts and an AI assistant — run your shop easily from your phone or computer." />
    <meta property="og:image" content="https://www.boutipro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Aperçu équivalent sur X/Twitter. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boutipro — Shop Management Made Simple" />
    <meta name="twitter:description" content="Inventory, sales, cash register, customer debts and an AI assistant — run your shop easily from your phone or computer." />
    <meta name="twitter:image" content="https://www.boutipro.com/og-image.png" />

    <!-- Couleur de la barre du navigateur sur mobile (Android/Chrome). -->
    <meta name="theme-color" content="#1e2a5e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
