<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Connexion en cours...</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1424;
    color: #eef1fb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 340px; }
  p { color: #9aa4c4; font-size: 14px; line-height: 1.5; }
  a.btn {
    display: none;
    margin-top: 20px;
    background: white;
    color: #0f1424;
    text-decoration: none;
    padding: 14px 24px;
    border-radius: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <p id="msg">Connexion en cours...</p>
    <a class="btn" id="btn" href="#">Ouvrir Shopnify</a>
  </div>
  <script>
    // Ce fichier n'est atteint QUE si Android n'a pas reconnu le App Link
    // (vérification assetlinks.json échouée, ou navigateur qui ne le supporte
    // pas). Dans le cas normal, Android ouvre l'app directement sans jamais
    // charger cette page.
    var full = (window.location.search || "") + (window.location.hash || "");
    var appUrl = "https://ma-boutique-tawny.vercel.app/auth-callback.html" + full;
    setTimeout(function () {
      document.getElementById("msg").textContent =
        "Si l'application ne s'ouvre pas automatiquement :";
      var btn = document.getElementById("btn");
      btn.href = appUrl;
      btn.style.display = "inline-block";
    }, 1200);
  </script>
</body>
</html>
